<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Rentals</title><link rel="stylesheet" href="style.css"></head><body>
<nav><a class="logo" href="/">RentX</a><a href="/">Home</a></nav><main class="section"><h1>My Rentals</h1><div class="lookup"><input id="email" type="email" placeholder="Enter booking email"><button class="btn" onclick="load()">Find Rentals</button></div><div id="list"></div></main>
<script>async function load(){let e=document.getElementById('email').value;let r=await fetch('/api/rentals/customer?email='+encodeURIComponent(e));let data=await r.json();list.innerHTML=data.length?data.map(x=>`<div class="rental"><b>Booking #${x.id}</b><p>Product ID: ${x.productId}</p><p>${x.startDate} → ${x.endDate} (${x.days} days)</p><strong>₹${x.totalPrice}</strong><span>${x.status}</span></div>`).join(''):'<p>No rentals found.</p>'}</script></body></html>
